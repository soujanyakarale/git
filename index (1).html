<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ShareBite | Share Food, Share Hope</title>
<style>
:root{--green:#087443;--green2:#0b8f55;--mint:#e8f6ed;--pale:#f5faf6;--ink:#18352a;--muted:#66786e;--line:#e1ebe4;--orange:#f4a340;--white:#fff;--shadow:0 14px 35px #123c2410}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;border-bottom:1px solid #edf2ee;background:#ffffffed;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:850;letter-spacing:-.8px;color:var(--green);cursor:pointer}.brandmark{width:38px;height:38px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:21px;box-shadow:0 6px 14px #08744330}.nav{display:flex;align-items:center;gap:27px}.nav a{font-size:14px;color:#53645a;text-decoration:none;cursor:pointer}.nav a:hover{color:var(--green)}.btn{padding:12px 18px;border-radius:11px;font-weight:750;font-size:14px;transition:.18s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--green);color:white;box-shadow:0 7px 15px #08744320}.primary:hover{background:#065f37}.outline{background:#fff;color:var(--green);border:1px solid #b6d9c3}.soft{background:var(--mint);color:var(--green)}.small{padding:8px 12px;font-size:12px;border-radius:8px}.hero{padding:66px 6% 58px;background:linear-gradient(115deg,#f5fbf6 0%,#fff 60%,#edf8f0 100%);display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center;min-height:515px}.eyebrow{display:inline-flex;align-items:center;gap:8px;background:#e3f4e9;color:var(--green);padding:8px 13px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.3px}.hero h1{font-size:clamp(38px,4.2vw,62px);line-height:1.06;letter-spacing:-2.5px;margin:20px 0 18px;max-width:650px}.hero h1 span{color:var(--green)}.hero p{font-size:17px;line-height:1.75;color:#65756b;max-width:530px;margin-bottom:27px}.actions{display:flex;gap:12px;flex-wrap:wrap}.trust{display:flex;gap:18px;align-items:center;margin-top:27px;color:#718077;font-size:12px}.trust b{color:var(--green)}.hero-art{position:relative;min-height:355px;display:grid;place-items:center}.food-photo{width:100%;height:340px;object-fit:cover;border-radius:32px;box-shadow:0 25px 55px #194e2b20;background:#d9ebdc}.photo-overlay{position:absolute;inset:0;border-radius:32px;background:linear-gradient(0deg,#092b1d50,transparent 60%);pointer-events:none}.float-card{position:absolute;background:white;padding:15px 18px;border-radius:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:11px}.float-card.one{left:-24px;bottom:28px}.float-card.two{right:-18px;top:24px}.bubble{width:42px;height:42px;border-radius:13px;background:var(--mint);display:grid;place-items:center;font-size:22px}.float-card strong{display:block;font-size:13px}.float-card small{color:var(--muted);font-size:11px}.section{padding:68px 6%}.section.tint{background:var(--pale)}.section-head{text-align:center;max-width:650px;margin:0 auto 34px}.section-head h2{font-size:34px;letter-spacing:-1px;margin:0 0 12px}.section-head p{color:var(--muted);line-height:1.65;margin:0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.feature,.food-card,.panel,.stat,.match-card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.feature{padding:25px}.feature-icon{width:50px;height:50px;border-radius:15px;background:var(--mint);display:grid;place-items:center;font-size:24px}.feature h3{margin:17px 0 8px;font-size:18px}.feature p{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}.step{text-align:center;padding:22px}.stepnum{width:42px;height:42px;margin:0 auto 13px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:white;font-weight:800}.step h3{margin:10px 0}.step p{color:var(--muted);font-size:14px;line-height:1.6}.cta{margin:0 6% 65px;padding:38px 42px;border-radius:24px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:25px}.cta h2{margin:0 0 8px;font-size:28px}.cta p{margin:0;color:#d4eddd}.cta .btn{background:white;color:var(--green)}footer{padding:26px 6%;display:flex;justify-content:space-between;color:#738178;font-size:12px;border-top:1px solid var(--line)}
/* app views */.app-layout{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 76px);background:#f7faf8}.sidebar{background:#0a3b29;color:white;padding:25px 16px}.side-brand{font-size:20px;font-weight:850;padding:4px 12px 26px}.side-label{color:#a6c9b4;text-transform:uppercase;letter-spacing:1.3px;font-size:10px;padding:12px}.side-link{width:100%;text-align:left;background:transparent;color:#d9eee1;padding:12px;border-radius:10px;margin:2px 0;font-size:13px;display:flex;gap:11px;align-items:center}.side-link.active,.side-link:hover{background:#ffffff1b;color:#fff}.app-main{padding:32px 4.5%;min-width:0}.page-title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.page-title h1{margin:0 0 5px;font-size:29px;letter-spacing:-.7px}.page-title p{margin:0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:23px}.stat{padding:19px}.stat .label{font-size:12px;color:var(--muted)}.stat .value{font-size:29px;font-weight:850;margin:8px 0 4px}.stat .hint{font-size:11px;color:var(--green)}.panel{padding:22px;margin-bottom:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.panel h2,.panel h3{margin:0;font-size:17px}.muted{color:var(--muted);font-size:13px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:#819087;font-size:11px;text-transform:uppercase;letter-spacing:.6px;background:#f8fbf9}td,th{padding:13px 12px;border-bottom:1px solid #edf2ee;white-space:nowrap}tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;background:#e7f7ed;color:#087443;font-size:11px;font-weight:750}.badge.orange{background:#fff2dc;color:#a96708}.badge.blue{background:#e9f2ff;color:#2e64a5}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#46584d}.field input,.field select,.field textarea{width:100%;border:1px solid #dbe6de;border-radius:10px;padding:12px 13px;background:#fff;outline:none;color:var(--ink)}.field input:focus,.field select:focus,.field textarea:focus{border-color:#62ad7e;box-shadow:0 0 0 3px #dff2e5}.field textarea{min-height:90px;resize:vertical}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.food-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.food-card{overflow:hidden}.food-banner{height:130px;display:grid;place-items:center;font-size:55px;background:linear-gradient(135deg,#dff3e5,#f8f5df)}.food-body{padding:17px}.food-body h3{margin:0 0 8px;font-size:16px}.food-meta{display:flex;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin:10px 0 15px}.food-body .btn{width:100%}.match-list{display:grid;gap:13px}.match-card{padding:18px;display:flex;align-items:center;gap:15px}.ngo-avatar{height:50px;width:50px;border-radius:16px;background:#e1f4e7;display:grid;place-items:center;font-size:24px;flex-shrink:0}.match-content{flex:1}.match-content h3{margin:0 0 6px;font-size:15px}.match-content p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.score{font-size:20px;font-weight:850;color:var(--green);text-align:right}.score small{display:block;font-size:10px;font-weight:600;color:var(--muted)}.notice{padding:14px 16px;border-radius:12px;background:#fff8e8;color:#79541a;font-size:12px;line-height:1.6;margin-bottom:18px}.login-wrap{min-height:calc(100vh - 76px);display:grid;place-items:center;padding:35px;background:linear-gradient(120deg,#eff8f1,#fff)}.auth-card{width:min(460px,100%);background:white;padding:34px;border-radius:24px;box-shadow:0 20px 60px #123c2415;border:1px solid var(--line)}.auth-card .brand{justify-content:center;margin-bottom:20px}.auth-card h1{text-align:center;margin:0 0 8px;font-size:28px}.auth-card>p{text-align:center;color:var(--muted);font-size:13px;margin:0 0 24px}.auth-card .field{margin-bottom:15px}.auth-foot{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}.link{color:var(--green);font-weight:800;cursor:pointer}.empty{padding:35px;text-align:center;color:var(--muted)}.toast{position:fixed;right:24px;bottom:24px;background:#123c2b;color:white;padding:14px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:99;font-size:13px;max-width:340px;animation:up .2s ease}@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}.mobile-menu{display:none}
@media(max-width:900px){.nav{gap:12px}.nav a:nth-child(2),.nav a:nth-child(3){display:none}.hero{grid-template-columns:1fr;gap:30px;padding-top:45px}.hero-art{min-height:300px}.food-photo{height:300px}.grid3,.steps{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.food-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.app-layout{grid-template-columns:190px 1fr}.app-main{padding:25px 3%}.cta{flex-direction:column;align-items:flex-start}.float-card.one{left:0}.float-card.two{right:0}}
@media(max-width:620px){.topbar{height:65px;padding:0 4%}.brand{font-size:20px}.nav a{display:none}.nav .btn{padding:10px 12px}.hero{padding:38px 5%}.hero h1{font-size:42px}.section{padding:48px 5%}.cta{margin:0 5% 45px;padding:28px}.app-layout{display:block}.sidebar{display:flex;overflow-x:auto;padding:10px;gap:5px}.side-brand,.side-label{display:none}.side-link{white-space:nowrap;width:auto;margin:0;padding:10px}.app-main{padding:22px 4%}.page-title{align-items:flex-start;flex-direction:column}.stats{gap:9px}.stat{padding:14px}.stat .value{font-size:24px}.food-grid,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.match-card{align-items:flex-start;flex-wrap:wrap}.score{margin-left:auto}.float-card{padding:10px}.float-card.one{bottom:8px}.float-card.two{top:8px}footer{flex-direction:column;gap:8px}}
</style>
</head>
<body><div id="app"></div><div id="toast-root"></div>
<script>
const $=s=>document.querySelector(s);const app=$('#app');
const seedDonations=[{id:'SB-1024',food:'Vegetable Rice',category:'Cooked Food',qty:'20 packets',location:'Kolhapur, Maharashtra',time:'Today, 8:00 PM',status:'Available',emoji:'🍛'},{id:'SB-1023',food:'Chapati Packets',category:'Bakery & Meals',qty:'30 packets',location:'Shahupuri, Kolhapur',time:'Today, 7:00 PM',status:'Accepted',emoji:'🫓'},{id:'SB-1022',food:'Fresh Bananas',category:'Fruits',qty:'8 kg',location:'Rajarampuri, Kolhapur',time:'Today, 6:30 PM',status:'Delivered',emoji:'🍌'}];
let donations=JSON.parse(localStorage.getItem('sb_donations')||'null')||seedDonations;let role=localStorage.getItem('sb_role')||'Donor';let user=localStorage.getItem('sb_user')||'Vaishnavi';let current='home';
function save(){localStorage.setItem('sb_donations',JSON.stringify(donations))}function toast(msg){$('#toast-root').innerHTML=`<div class="toast">${msg}</div>`;setTimeout(()=>$('#toast-root').innerHTML='',3000)}
function brand(){return `<div class="brand" onclick="go('home')"><span class="brandmark">🌱</span>ShareBite</div>`}
function header(){return `<header class="topbar">${brand()}<nav class="nav"><a onclick="go('home')">Home</a><a onclick="go('how')">How It Works</a><a onclick="go('browse')">Browse Food</a><button class="btn outline" onclick="go('login')">Log in</button><button class="btn primary" onclick="go('register')">Get Started</button></nav></header>`}
function home(){return `${header()}<main><section class="hero"><div><div class="eyebrow">🌍 FOOD RESCUE · COMMUNITY IMPACT</div><h1>Good food deserves<br><span>a second chance.</span></h1><p>ShareBite connects surplus food from homes, restaurants and events with NGOs and communities that need it. Less waste. More meals. Stronger communities.</p><div class="actions"><button class="btn primary" onclick="go('register','Donor')">🍲 Donate Food</button><button class="btn outline" onclick="go('browse')">Find Available Food →</button></div><div class="trust"><span>✓ Simple to use</span><span>✓ Community powered</span><span><b>♻</b> Reduce food waste</span></div></div><div class="hero-art"><img class="food-photo" alt="Fresh food ready to share" src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1000&q=85" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(135deg,#d9efdf,#f6edcf)';this.parentElement.innerHTML+='<div style=&quot;font-size:110px&quot;>🥗🍲</div>'"><div class="photo-overlay"></div><div class="float-card one"><div class="bubble">🤝</div><div><strong>Food finds people</strong><small>One donation at a time</small></div></div><div class="float-card two"><div class="bubble">💚</div><div><strong>Make an impact</strong><small>Share food, share hope</small></div></div></div></section><section class="section"><div class="section-head"><h2>One platform. Three simple steps.</h2><p>We make it easier for people with extra food to reach the organisations serving people in need.</p></div><div class="steps"><div class="step"><div class="stepnum">1</div><div style="font-size:34px">🍱</div><h3>Donate surplus food</h3><p>Post food details, quantity, location and the time it should be collected.</p></div><div class="step"><div class="stepnum">2</div><div style="font-size:34px">🤝</div><h3>Connect with NGOs</h3><p>NGOs browse available donations and see sample recommendations for suitable matches.</p></div><div class="step"><div class="stepnum">3</div><div style="font-size:34px">🚚</div><h3>Deliver with care</h3><p>Volunteers help coordinate collection and delivery, while status updates keep everyone informed.</p></div></div></section><section class="section tint"><div class="section-head"><h2>Designed for everyone in the food chain</h2><p>Different roles work together toward one goal: getting good food to people who need it.</p></div><div class="grid3"><article class="feature"><div class="feature-icon">🍲</div><h3>Food Donors</h3><p>Restaurants, households and event organisers can list surplus food and follow its status.</p><button class="btn soft small" style="margin-top:18px" onclick="go('register','Donor')">Continue as donor →</button></article><article class="feature"><div class="feature-icon">🏠</div><h3>NGOs</h3><p>Community organisations can browse food listings, request donations and view match suggestions.</p><button class="btn soft small" style="margin-top:18px" onclick="go('register','NGO')">Continue as NGO →</button></article><article class="feature"><div class="feature-icon">🚴</div><h3>Volunteers</h3><p>Volunteers can view pickup and delivery tasks and update task status in the demo.</p><button class="btn soft small" style="margin-top:18px" onclick="go('register','Volunteer')">Continue as volunteer →</button></article></div></section><section class="section"><div class="section-head"><h2>Food available to share</h2><p>Example listings for the Phase 1 presentation prototype.</p></div>${foodCards(2)}</section><div class="cta"><div><h2>Have food to share?</h2><p>A small action can make a meaningful difference in someone's day.</p></div><button class="btn" onclick="go('register','Donor')">Start a donation →</button></div></main><footer><span>🌱 ShareBite · Share Food, Share Hope</span><span>Phase 1 presentation prototype · Demo data</span></footer>`}
function foodCards(limit=99){let arr=donations.filter(d=>d.status==='Available').slice(0,limit);if(!arr.length)return `<div class="panel empty">No available food right now. Check again later.</div>`;return `<div class="food-grid">${arr.map(d=>`<article class="food-card"><div class="food-banner">${d.emoji||'🍱'}</div><div class="food-body"><h3>${esc(d.food)}</h3><span class="badge">${esc(d.status)}</span><div class="food-meta"><span>📦 ${esc(d.qty)}</span><span>📍 ${esc(d.location)}</span><span>⏰ ${esc(d.time)}</span></div><button class="btn primary" onclick="requestFood('${d.id}')">Request Donation</button></div></article>`).join('')}</div>`}
function how(){return `${header()}<section class="section"><div class="section-head"><h2>How ShareBite works</h2><p>From listing surplus food to coordinating delivery, the prototype shows the main journey.</p></div><div class="grid3"><article class="feature"><div class="feature-icon">📝</div><h3>1. Post a donation</h3><p>A donor enters food name, category, quantity, pickup location and consume-before time.</p></article><article class="feature"><div class="feature-icon">🧠</div><h3>2. Find a suitable NGO</h3><p>The concept uses distance, food needs, capacity and urgency to help rank potential matches.</p></article><article class="feature"><div class="feature-icon">🚚</div><h3>3. Coordinate delivery</h3><p>An NGO requests the donation and a volunteer can coordinate the pickup and delivery status.</p></article></div><div class="notice" style="margin-top:25px"><b>Phase 1 scope:</b> This is a front-end demonstration with sample data saved in your browser. Live accounts, real-time notifications, database integration and a trained AI model are not connected in this prototype.</div><button class="btn primary" onclick="go('register')">Try the prototype →</button></section>${footer()}`}
function footer(){return `<footer><span>🌱 ShareBite · Share Food, Share Hope</span><span>Phase 1 prototype · Demo data only</span></footer>`}
function login(){return `${header()}<section class="login-wrap"><div class="auth-card">${brand()}<h1>Welcome back</h1><p>Sign in to continue to your ShareBite workspace.</p><form onsubmit="event.preventDefault();doLogin()"><div class="field"><label>Email address</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="Enter any demo password" required></div><div class="field"><label>Continue as</label><select id="login-role"><option>Donor</option><option>NGO</option><option>Volunteer</option><option>Admin</option></select></div><button class="btn primary" style="width:100%;margin-top:5px">Log in to demo</button></form><div class="auth-foot">New to ShareBite? <span class="link" onclick="go('register')">Create an account</span><br><br><small>Demo only: any email and password will work. No account is created.</small></div></div></section>${footer()}`}
function register(){return `${header()}<section class="login-wrap"><div class="auth-card">${brand()}<h1>Create your account</h1><p>Join your local food-sharing community.</p><form onsubmit="event.preventDefault();doRegister()"><div class="field"><label>Full name / organisation</label><input id="reg-name" placeholder="Enter your name" required></div><div class="field"><label>Email address</label><input id="reg-email" type="email" placeholder="you@example.com" required></div><div class="field"><label>Phone number</label><input id="reg-phone" type="tel" placeholder="Your contact number"></div><div class="field"><label>Location</label><input id="reg-location" placeholder="City or area"></div><div class="field"><label>I want to join as</label><select id="reg-role"><option>Donor</option><option>NGO</option><option>Volunteer</option></select></div><button class="btn primary" style="width:100%">Create demo account</button></form><div class="auth-foot">Already registered? <span class="link" onclick="go('login')">Log in</span></div></div></section>${footer()}`}
function side(active){let items=[['dashboard','▦','Dashboard'],['add','＋','Add Donation'],['browse','♧','Available Food'],['matches','✧','AI Matching'],['volunteer','↗','Pickup & Delivery'],['admin','▤','Admin Overview']];return `<aside class="sidebar"><div class="side-brand">🌱 ShareBite</div><div class="side-label">Workspace</div>${items.map(([id,ic,label])=>`<button class="side-link ${active===id?'active':''}" onclick="go('${id}')"><span>${ic}</span>${label}</button>`).join('')}<div class="side-label" style="margin-top:25px">Account</div><button class="side-link" onclick="go('home')">⌂ Back to website</button><button class="side-link" onclick="go('login')">⇥ Switch demo role</button></aside>`}
function shell(active,content){return `${header()}<div class="app-layout">${side(active)}<main class="app-main">${content}</main></div>${footer()}`}
function title(h,sub,button=''){return `<div class="page-title"><div><h1>${h}</h1><p>${sub}</p></div>${button}</div>`}
function statCards(){return `<div class="stats"><div class="stat"><div class="label">Total Donations</div><div class="value">${donations.length+9}</div><div class="hint">↗ Community contributions</div></div><div class="stat"><div class="label">Available</div><div class="value">${donations.filter(d=>d.status==='Available').length}</div><div class="hint">Ready to be requested</div></div><div class="stat"><div class="label">Accepted</div><div class="value">${donations.filter(d=>d.status==='Accepted').length+4}</div><div class="hint">NGO requests</div></div><div class="stat"><div class="label">Delivered</div><div class="value">${donations.filter(d=>d.status==='Delivered').length+2}</div><div class="hint">Completed in demo</div></div></div>`}
function dashboard(){let rows=donations.map(d=>`<tr><td><b>${esc(d.food)}</b><br><small class="muted">${d.id}</small></td><td>${esc(d.qty)}</td><td><span class="badge ${d.status==='Accepted'?'orange':''}">${esc(d.status)}</span></td><td><button class="btn soft small" onclick="toast('Donation details for ${esc(d.food)}')">View</button></td></tr>`).join('');return shell('dashboard',`${title(`Welcome, ${esc(user)}! 👋`,'Here is a quick overview of your ShareBite activity.',`<button class="btn primary" onclick="go('add')">＋ Add Donation</button>`)}${statCards()}<div class="panel"><div class="panel-head"><h2>Recent donations</h2><button class="btn outline small" onclick="go('browse')">View available food</button></div><div class="table-wrap"><table><thead><tr><th>Food item</th><th>Quantity</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="grid3"><div class="feature"><div class="feature-icon">🍲</div><h3>Donate food</h3><p>List surplus food and add pickup details.</p><button class="btn soft small" style="margin-top:14px" onclick="go('add')">Create listing</button></div><div class="feature"><div class="feature-icon">🧠</div><h3>AI match demo</h3><p>Explore example NGO recommendations.</p><button class="btn soft small" style="margin-top:14px" onclick="go('matches')">View matches</button></div><div class="feature"><div class="feature-icon">🚚</div><h3>Delivery tasks</h3><p>View and update example pickup tasks.</p><button class="btn soft small" style="margin-top:14px" onclick="go('volunteer')">View tasks</button></div></div>`)}
function add(){return shell('add',`${title('Add a food donation','Share the details so an NGO can decide if it can collect the food.')}<div class="panel"><form onsubmit="event.preventDefault();submitDonation()"><div class="form-grid"><div class="field"><label>Food name *</label><input id="food-name" placeholder="e.g. Vegetable rice" required></div><div class="field"><label>Food category *</label><select id="food-category"><option>Cooked Food</option><option>Fruits</option><option>Vegetables</option><option>Bakery & Meals</option><option>Packaged Food</option></select></div><div class="field"><label>Quantity *</label><input id="food-qty" placeholder="e.g. 20 packets or 8 kg" required></div><div class="field"><label>Prepared at</label><input id="food-prep" type="datetime-local"></div><div class="field"><label>Consume before *</label><input id="food-expiry" type="datetime-local" required></div><div class="field"><label>Pickup location *</label><input id="food-location" placeholder="Area, city" required></div><div class="field full"><label>Food safety details</label><textarea id="food-safety" placeholder="Storage details, allergens, packaging, etc."></textarea></div></div><div class="notice" style="margin-top:18px;margin-bottom:0">Please list only food that is safe to donate. This demo does not verify food safety or expiry information automatically.</div><div class="form-actions"><button type="button" class="btn outline" onclick="go('dashboard')">Cancel</button><button class="btn primary">Submit donation</button></div></form></div>`)}
function browse(){return shell('browse',`${title('Available food donations','Browse sample listings and try requesting a donation.')}<div class="notice">Demo listings are examples for the Phase 1 presentation. Requesting a donation updates its status in this browser only.</div>${foodCards()}`)}
function matches(){return shell('matches',`${title('AI matching recommendations','Example NGO ranking based on distance, food needs, capacity and urgency.')}<div class="notice"><b>Prototype note:</b> These match scores are illustrative sample values. No trained AI model or live location service is connected yet.</div><div class="panel"><div class="panel-head"><h2>Donation: Vegetable Rice</h2><span class="badge">20 packets · Example</span></div><p class="muted">The matching concept ranks NGOs that may be able to collect this donation.</p></div><div class="match-list"><div class="match-card"><div class="ngo-avatar">🏠</div><div class="match-content"><h3>Helping Hands Community NGO</h3><p>📍 2 km away · Capacity: 200 packets<br>Food need: High · Can coordinate pickup today</p></div><div class="score">92%<small>Example match</small><button class="btn primary small" onclick="toast('Demo: NGO details opened')">View details</button></div></div><div class="match-card"><div class="ngo-avatar">💚</div><div class="match-content"><h3>Care & Share Foundation</h3><p>📍 5 km away · Capacity: 100 packets<br>Food need: Medium · Volunteer available</p></div><div class="score">84%<small>Example match</small><button class="btn outline small" onclick="toast('Demo: NGO details opened')">View details</button></div></div><div class="match-card"><div class="ngo-avatar">🤝</div><div class="match-content"><h3>Community Meal Centre</h3><p>📍 7 km away · Capacity: 60 packets<br>Food need: High · Collection time to confirm</p></div><div class="score">76%<small>Example match</small><button class="btn outline small" onclick="toast('Demo: NGO details opened')">View details</button></div></div></div>`)}
function volunteer(){return shell('volunteer',`${title('Pickup & delivery tasks','Example tasks a volunteer may be assigned.')}<div class="panel"><div class="panel-head"><h2>My tasks</h2><span class="badge orange">2 tasks pending</span></div><div class="table-wrap"><table><thead><tr><th>Task ID</th><th>Pickup</th><th>Deliver to</th><th>Status</th><th>Update</th></tr></thead><tbody><tr><td>PK-001</td><td>Local Restaurant</td><td>Helping Hands NGO</td><td><span class="badge orange" id="task-status-1">Assigned</span></td><td><button class="btn soft small" onclick="taskUpdate(1)">Update status</button></td></tr><tr><td>PK-002</td><td>Community Hall</td><td>Community Meal Centre</td><td><span class="badge" id="task-status-2">Collected</span></td><td><button class="btn soft small" onclick="taskUpdate(2)">Update status</button></td></tr></tbody></table></div></div><div class="notice">This page simulates task status changes. Real GPS tracking and volunteer assignment are not connected.</div>`)}
function admin(){return shell('admin',`${title('Platform overview','Admin view for the Phase 1 project demonstration.')}<div class="stats"><div class="stat"><div class="label">Total users</div><div class="value">128</div><div class="hint">Sample statistic</div></div><div class="stat"><div class="label">Total donations</div><div class="value">${donations.length+42}</div><div class="hint">Includes demo data</div></div><div class="stat"><div class="label">Verified NGOs</div><div class="value">18</div><div class="hint">Sample statistic</div></div><div class="stat"><div class="label">Pending donations</div><div class="value">${donations.filter(d=>d.status==='Available').length}</div><div class="hint">Current local demo</div></div></div><div class="panel"><div class="panel-head"><h2>Donation management</h2><button class="btn outline small" onclick="go('browse')">Open listings</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Food</th><th>Quantity</th><th>Status</th><th>Admin action</th></tr></thead><tbody>${donations.map(d=>`<tr><td>${d.id}</td><td>${esc(d.food)}</td><td>${esc(d.qty)}</td><td><span class="badge">${esc(d.status)}</span></td><td><button class="btn soft small" onclick="adminStatus('${d.id}')">Mark delivered</button></td></tr>`).join('')}</tbody></table></div></div><div class="notice">Admin figures and users are sample presentation data. This prototype does not provide real authentication or access control.</div>`)}
function go(page,selectedRole){current=page;if(selectedRole){role=selectedRole;localStorage.setItem('sb_role',role)}let html={home,how,login,register,dashboard,add,browse,matches,volunteer,admin}[page];if(!html)html=home;app.innerHTML=html();window.scrollTo(0,0)}
function doLogin(){role=$('#login-role').value;user=$('#email').value.split('@')[0]||'Demo User';localStorage.setItem('sb_role',role);localStorage.setItem('sb_user',user);toast('Demo login successful. Welcome to ShareBite!');setTimeout(()=>go(role==='NGO'?'browse':role==='Volunteer'?'volunteer':role==='Admin'?'admin':'dashboard'),350)}
function doRegister(){user=$('#reg-name').value.trim()||'Demo User';role=$('#reg-role').value;localStorage.setItem('sb_role',role);localStorage.setItem('sb_user',user);toast('Demo account ready. No real account was created.');setTimeout(()=>go(role==='NGO'?'browse':role==='Volunteer'?'volunteer':'dashboard'),350)}
function submitDonation(){let name=$('#food-name').value.trim(),qty=$('#food-qty').value.trim(),loc=$('#food-location').value.trim(),expiry=$('#food-expiry').value;if(expiry&&new Date(expiry)<new Date()){toast('Please enter a future consume-before time.');return}let d=new Date(expiry);let time=expiry?d.toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Time to be confirmed';donations.unshift({id:'SB-'+Math.floor(1000+Math.random()*9000),food:name,category:$('#food-category').value,qty,location:loc,time,status:'Available',emoji:'🍱'});save();toast('Donation added to this browser demo!');go('dashboard')}
function requestFood(id){let d=donations.find(x=>x.id===id);if(!d)return;d.status='Accepted';save();toast('Demo request recorded for '+d.food);go('browse')}
function taskUpdate(id){let el=$('#task-status-'+id);if(!el)return;let next=el.textContent==='Assigned'?'Collected':el.textContent==='Collected'?'Delivered':'Assigned';el.textContent=next;el.className='badge '+(next==='Assigned'?'orange':'');toast('Task status changed to '+next+' (demo only).')}
function adminStatus(id){let d=donations.find(x=>x.id===id);if(d){d.status='Delivered';save();go('admin');toast('Donation marked delivered in demo.')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
go('home');
</script></body></html>
